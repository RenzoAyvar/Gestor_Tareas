# Este compose va al servidor, junto a .env seguro (no commiteado).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes: [postgres_prod:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 15

  backend:
    image: ghcr.io/${GHCR_OWNER:?}/evaluacion2-backend:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      DEV_CREATE_TABLES: "false"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/${GHCR_OWNER:?}/evaluacion2-frontend:${IMAGE_TAG:?}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on: [backend]

volumes:
  postgres_prod:
