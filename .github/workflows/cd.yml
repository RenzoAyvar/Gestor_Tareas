name: CD - GHCR y despliegue aprobado
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag de imagen publicada por CI (sha-<40 dígitos hexadecimales>)'
        type: string
        required: true
      initialize_schema:
        description: 'Inicializar tablas (solo en el primer despliegue)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: tag
        shell: bash
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
      - name: Login GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Construir y publicar
        shell: bash
        run: |
          docker build -t "ghcr.io/${{ steps.tag.outputs.owner }}/evaluacion2-backend:${{ steps.tag.outputs.image_tag }}" ./backend
          docker build --target production -t "ghcr.io/${{ steps.tag.outputs.owner }}/evaluacion2-frontend:${{ steps.tag.outputs.image_tag }}" ./frontend
          docker push "ghcr.io/${{ steps.tag.outputs.owner }}/evaluacion2-backend:${{ steps.tag.outputs.image_tag }}"
          docker push "ghcr.io/${{ steps.tag.outputs.owner }}/evaluacion2-frontend:${{ steps.tag.outputs.image_tag }}"

  deploy:
    # Deploy manual: requiere imagen publicada, entorno aprobado y rol OIDC limitado.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Validar configuración de producción
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          : "${AWS_ROLE_ARN:?Falta la variable AWS_ROLE_ARN en el environment production}"
          : "${AWS_REGION:?Falta la variable AWS_REGION en el environment production}"
          : "${EC2_INSTANCE_ID:?Falta la variable EC2_INSTANCE_ID en el environment production}"
          [[ "$EC2_INSTANCE_ID" =~ ^i-[a-fA-F0-9]{8}([a-fA-F0-9]{9})?$ ]] || {
            echo 'EC2_INSTANCE_ID inválido'
            exit 1
          }
          [[ "$IMAGE_TAG" =~ ^sha-[a-fA-F0-9]{40}$ ]] || {
            echo 'IMAGE_TAG inválido'
            exit 1
          }

      - name: Obtener credenciales temporales de AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Desplegar por Systems Manager Run Command
        shell: bash
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          OWNER_RAW: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          INITIALIZE_SCHEMA: ${{ inputs.initialize_schema }}
        run: |
          set -euo pipefail

          ping_status="$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)"
          [[ "$ping_status" == "Online" ]] || {
            echo "La instancia $EC2_INSTANCE_ID no está Online en SSM (estado: $ping_status)"
            exit 1
          }

          GHCR_OWNER="$(echo "$OWNER_RAW" | tr '[:upper:]' '[:lower:]')"
          COMPOSE_B64="$(base64 -w 0 compose.prod.yml)"

          {
            printf 'GHCR_OWNER=%q\n' "$GHCR_OWNER"
            printf 'IMAGE_TAG=%q\n' "$IMAGE_TAG"
            printf 'INITIALIZE_SCHEMA=%q\n' "$INITIALIZE_SCHEMA"
            printf 'COMPOSE_B64=%q\n' "$COMPOSE_B64"
            cat <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          PROJECT_DIR='/opt/evaluacion-2'
          COMPOSE_VERSION='v2.32.4'

          if ! command -v docker >/dev/null || ! command -v curl >/dev/null || ! command -v openssl >/dev/null; then
            dnf install -y docker curl openssl
          fi

          if ! docker compose version >/dev/null 2>&1; then
            install -d -m 0755 /usr/local/lib/docker/cli-plugins
            curl --fail --show-error --silent --location --retry 5 \
              "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64" \
              --output /usr/local/lib/docker/cli-plugins/docker-compose
            chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose
          fi

          systemctl enable --now docker
          install -d -m 0750 "$PROJECT_DIR/backend"
          printf '%s' "$COMPOSE_B64" | base64 --decode > "$PROJECT_DIR/compose.prod.yml"
          chmod 0644 "$PROJECT_DIR/compose.prod.yml"

          if [[ ! -s "$PROJECT_DIR/.env" ]]; then
            umask 077
            db_password="$(openssl rand -hex 24)"
            printf 'POSTGRES_USER=eval2\nPOSTGRES_PASSWORD=%s\nPOSTGRES_DB=eval2db\n' \
              "$db_password" > "$PROJECT_DIR/.env"
            unset db_password
          fi

          if [[ ! -s "$PROJECT_DIR/backend/.env" ]]; then
            umask 077
            jwt_secret="$(openssl rand -hex 32)"
            printf 'JWT_SECRET=%s\nJWT_EXPIRE_MINUTES=60\n' \
              "$jwt_secret" > "$PROJECT_DIR/backend/.env"
            unset jwt_secret
          fi

          chmod 0600 "$PROJECT_DIR/.env" "$PROJECT_DIR/backend/.env"
          cd "$PROJECT_DIR"

          compose() {
            env GHCR_OWNER="$GHCR_OWNER" IMAGE_TAG="$IMAGE_TAG" \
              docker compose --env-file .env -f compose.prod.yml "$@"
          }

          compose config --quiet
          compose pull

          if [[ "$INITIALIZE_SCHEMA" == 'true' ]]; then
            compose up -d db
            compose run --rm -e ALLOW_SCHEMA_INIT=yes backend python -m scripts.init_schema
          fi

          compose up -d --remove-orphans
          compose ps

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1/ >/dev/null; then
              echo 'Despliegue listo: frontend responde por HTTP local.'
              exit 0
            fi
            sleep 2
          done

          compose logs --tail=100
          echo 'El frontend no respondió dentro del tiempo esperado.' >&2
          exit 1
          REMOTE_SCRIPT
          } > /tmp/deploy-ssm.sh

          jq -n --rawfile script /tmp/deploy-ssm.sh \
            '{commands: [$script]}' > /tmp/ssm-parameters.json

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name 'AWS-RunShellScript' \
            --comment "Deploy $IMAGE_TAG desde GitHub Actions" \
            --timeout-seconds 900 \
            --parameters file:///tmp/ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)"
          echo "SSM CommandId: $command_id"

          status='Pending'
          for attempt in $(seq 1 120); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"
            case "$status" in
              Success|Cancelled|Failed|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          [[ "$status" == 'Success' ]] || {
            echo "El despliegue remoto terminó con estado: $status"
            exit 1
          }
